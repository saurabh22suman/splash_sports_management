[project]
name = "splashh-backend"
version = "0.1.0"
description = "Splashh Sports Platform backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    # Cache / queue
    "redis>=5.2.0",
    # Auth
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.10.0",
    # Validation / settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",
    # Observability
    "structlog>=24.4.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    # HTTP client (for tests and webhooks)
    "httpx>=0.28.0",
    # Misc
    "python-slugify>=8.0.4",
    "ulid-py>=1.1.0",
    "orjson>=3.10.0",
    "python-multipart>=0.0.32",
    # Payments
    "razorpay>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "freezegun>=1.5.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "faker>=33.0.0",
    "factory-boy>=3.3.1",
    "respx>=0.21.1",
    "responses>=0.25.0",
    "testcontainers[postgres,redis]>=4.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "TID", "PT", "Q", "RET", "SIM", "TCH", "ARG", "PL", "RUF", "S"]
ignore = ["PLR0913", "PLR0915", "PLR2004", "RET504", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101", "S106", "ARG001", "ARG002"]
"src/payments/application/provider.py" = ["ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["common", "auth", "customer", "facility", "booking"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/tests/*", "*/alembic/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["alembic.*", "pytest.*", "factory.*"]
ignore_missing_imports = true
