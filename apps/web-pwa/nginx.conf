# nginx config for the Splashh PWA.
#
# Goals:
#   1. Serve hashed assets from /assets/ with long-lived cache headers.
#   2. Fall back to index.html so React Router deep links work on refresh.
#   3. Hand off /v1/* to the backend service via Dokploy's Traefik layer
#      (configured at the docker-compose level — this file only handles
#      static + SPA routing inside the web-pwa container).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache for fingerprinted Vite assets.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker + manifest — must not be cached aggressively.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA fallback — any unmatched path renders the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html so deploys pick up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Tiny security hardening — no inline scripts, no eval, allow self.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
