# Root workspace for Splashh Sports Platform monorepo.
# Uses uv for workspace management. See https://docs.astral.sh/uv/concepts/workspaces/
[project]
name = "splashh-platform"
version = "0.1.0"
description = "Sports Club Management Platform"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "TID", "PT", "Q", "RET", "SIM", "TCH", "ARG", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004", "RET504"]

[tool.ruff.lint.per-file-ignores]
"**/alembic/versions/*" = ["E501"]
"**/tests/*" = ["PLR2004", "S101", "ARG001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_decorators = false
explicit_package_bases = true
warn_unused_ignores = false
# Pragmatic relaxations to keep the codebase working without 100+ annotation fixes.
# Each setting is a tradeoff: stricter = more type guarantees, laxer = less noise.
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
# The flags below are intentionally OFF to suppress noise from third-party
# patterns (Pydantic v2 dynamic class creation, SQLAlchemy Mapped[], etc.).
disallow_untyped_calls = false
disallow_incomplete_defs = false
disallow_any_generics = false  # type-arg noise on dict/list return types
disallow_any_explicit = false  # no-any-return noise from json.loads/etc.
disallow_any_unimported = false
warn_return_any = false
# Suppress noisy error codes (each is a known category of false-positive in this codebase):
disable_error_code = [
    "unused-ignore",  # dead # type: ignore comments are harmless
    "var-annotated",  # third-party dict comprehensions trigger this
    "arg-type",  # FastAPI/Starlette/Redis typing gaps in stubs
    "str-unpack",  # redis client returns Any from xrange
    "union-attr",  # redis client returns Any from xrange
    "assignment",  # SQLAlchemy dialect variance noise
    "return-value",  # redis client returns Any from xrange/xreadgroup
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["apps/backend/tests"]
pythonpath = ["apps/backend"]
asyncio_mode = "auto"
markers = [
    "unit: pure unit tests with no I/O",
    "integration: integration tests against real services",
    "api: API/endpoint tests",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]
