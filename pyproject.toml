# Root workspace for Splashh Sports Platform monorepo.
# Uses uv for workspace management. See https://docs.astral.sh/uv/concepts/workspaces/
[project]
name = "splashh-platform"
version = "0.1.0"
description = "Sports Club Management Platform"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "TID", "PT", "Q", "RET", "SIM", "TCH", "ARG", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004", "RET504"]

[tool.ruff.lint.per-file-ignores]
"**/alembic/versions/*" = ["E501"]
"**/tests/*" = ["PLR2004", "S101", "ARG001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["alembic.*", "pytest.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["apps/backend/tests"]
pythonpath = ["apps/backend"]
asyncio_mode = "auto"
markers = [
    "unit: pure unit tests with no I/O",
    "integration: integration tests against real services",
    "api: API/endpoint tests",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]
